<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kan</title>

    <link rel="stylesheet" href="game/css/estilos.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <main id="main">
        <div id="game-status-console"><p>Cargando...</p></div>
        <div id="board">
        </div>
    </main>
    <section id="controls">
    </section>
    <aside id="player1">
        <h2>Negras</h2>
        <div class="pieces_board"></div>
    </aside>
    <aside id="player2">
        <h2>Blancas</h2>
        <div class="pieces_board"></div>
    </aside>

    <script src="game/js/data.js"></script>
    <script src="game/js/utils.js"></script>
    <script src="game/js/ui.js"></script>
    <script src="game/js/build.js"></script>
    <script src="game/js/online.js"></script>
    <script src="game/js/game.js"></script>
    <script src="game/js/setup.js"></script>

    <!-- Modal de Configuración de Partida -->
    <div id="setup-overlay" class="modal-overlay">
        <div id="setup-modal" class="modal-content">
            <h2>Configurar Partida</h2>
            <div class="form-group">
                <label for="player1-name">Tu Nombre (Jugador 1)</label>
                <input type="text" id="player1-name" value="Host" placeholder="Introduce tu nombre">
            </div>
            <div class="form-group" id="color-selection-group">
                <label>Elige tu color:</label>
                <div class="radio-group">
                    <input type="radio" id="color-black" name="player-color" value="negro" checked>
                    <label for="color-black">Negras</label>
                    <input type="radio" id="color-white" name="player-color" value="blanco">
                    <label for="color-white">Blancas</label>
                </div>
            </div>
            <div class="form-group">
                <label for="player2-name">Nombre del Oponente</label>
                <input type="text" id="player2-name" value="Invitado" placeholder="(se actualizará automáticamente)" disabled>
            </div>
            <div class="modal-buttons">
                <button id="start-solo-button">Jugar Solo</button>
                <button id="start-online-button">Jugar Online</button>
            </div>
        </div>
    </div>

</body>
</html>
